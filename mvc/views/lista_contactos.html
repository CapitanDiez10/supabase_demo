$def with (datos)
<section>
    <h2>Contactos</h2>

    <a class="boton" href="/insertar_contacto">Nuevo contacto</a>

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            $for registro in datos:
                <tr>
                    <td><img src="/static/fotos/$(registro.get('foto') or 'default.png')" alt="Foto de $registro['nombre']" height="50" width="50"></td>
                    <td>$registro["nombre"]</td>
                    <td>$registro["email"]</td>
                    <td>$registro["telefono"]</td>
                    <td>
                        <a href="/ver_contacto/$registro['id_contacto']">Ver</a>
                        <a href="/actualizar_contacto/$registro['id_contacto']">Actualizar</a>
                        <a href="/borrar_contacto/$registro['id_contacto']">Borrar</a>
                    </td>
                </tr>
        </tbody>
    </table>
</section>
